services:
  openreader:
    image: openreader:local
    build:
      context: https://github.com/richardr1126/openreader.git
      dockerfile: Dockerfile
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:3003}
      AUTH_SECRET: ${AUTH_SECRET:-local-openreader-auth-secret-change-me}
      USE_ANONYMOUS_AUTH_SESSIONS: ${USE_ANONYMOUS_AUTH_SESSIONS:-false}
      COMPUTE_CREDENTIAL_BROKER_TOKEN: ${COMPUTE_CREDENTIAL_BROKER_TOKEN:-local-credential-broker-token}
      COMPUTE_WORKER_HOST: 0.0.0.0
      COMPUTE_WORKER_PUBLIC_URL: ${COMPUTE_WORKER_PUBLIC_URL:-http://localhost:8081}
      TTS_PLAYBACK_TOKEN_SECRET: ${TTS_PLAYBACK_TOKEN_SECRET:-local-tts-playback-token-secret}
      FFMPEG_BIN: /app/ffmpeg/bin/ffmpeg
      RUNTIME_SEED_JSON: |-
        {
          "version": 1,
          "runtimeConfig": {
            "defaultTtsProvider": "kokoro"
          },
          "providers": [
            {
              "slug": "kokoro",
              "displayName": "Kokoro",
              "providerType": "custom-openai",
              "baseUrl": "http://thinker.dragons-rage.net:8880/v1",
              "defaultModel": "kokoro",
              "enabled": true
            }
          ]
        }
    # ports:
    #   - "3003:3003"
    #   - "8333:8333"
    #   - "8081:8081"
    volumes:
      - openreader-docstore:/app/docstore
      - ./ffmpeg:/app/ffmpeg

volumes:
  openreader-docstore: {}
