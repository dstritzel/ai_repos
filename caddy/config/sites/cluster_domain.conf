# This'll allow us to use a wildcard for all the subdomains
# of our cluster domain
*.{$AI_DOMAIN} {
}

# pgAdmin for PostgreSQL management
pgadmin.{$AI_DOMAIN} {
 reverse_proxy {$UNRAID_HOST}:8792
}

rabbitmq.{$AI_DOMAIN} {
 reverse_proxy rabbitmq:15672
}

mqtt.{$AI_DOMAIN} {
 reverse_proxy rabbitmq:9001
}

# alltalk.{$AI_DOMAIN} {
#  reverse_proxy {$MEGAMIND_HOST}:7852
# }

tavern.{$AI_DOMAIN} {
  reverse_proxy sillytavern:8000
}

botinterface.{$AI_DOMAIN} {
	reverse_proxy {$NODE1}:7860
}

code.{$AI_DOMAIN} {
	reverse_proxy code-server:8443
}

