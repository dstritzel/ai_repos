## OmniRoute
route.{$AI_DOMAIN} {
  reverse_proxy omniroute:20128
  encode gzip zstd
  header {
    # Add security headers
    Strict-Transport-Security "max-age=31536000; includeSubDomains"
    X-Content-Type-Options "nosniff"
    X-Frame-Options "DENY"
    Referrer-Policy "strict-origin-when-cross-origin"
  }
}

openreader.{$AI_DOMAIN} {
  reverse_proxy {$NODE1}:3003
}

openreader-compute-worker.{$AI_DOMAIN} {
  reverse_proxy {$NODE1}:8081
}

claw.{$AI_DOMAIN} {
  reverse_proxy {$NODE1}:18789
}

ollama.{$AI_DOMAIN} {
  reverse_proxy {$THINKER_HOST}:9401
}

